apiVersion: v1
kind: Service
metadata:
  name: prowlarr
spec:
  type: {{ .Values.service.type | default "ClusterIP" }}
  selector:
    app: prowlarr
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      {{- if eq .Values.service.type "NodePort" }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}