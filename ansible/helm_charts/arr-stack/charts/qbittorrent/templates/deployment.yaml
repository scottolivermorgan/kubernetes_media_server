apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "qbittorrent.fullname" . }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qbittorrent
  template:
    metadata:
      labels:
        app: qbittorrent
    spec:
      containers:
        - name: qbittorrent
          image: lscr.io/linuxserver/qbittorrent:version-5.0.3-r0
          env:
            - name: PUID
              value: "{{ .Values.puid | default $.Values.global.puid }}"
            - name: PGID
              value: "{{ .Values.pgid | default $.Values.global.pgid }}"
            - name: TZ
              value: "{{ .Values.timezone | default $.Values.global.timezone }}"
            - name: WEBUI_PORT
              value: "{{ .Values.webuiPort }}"
            - name: TORRENTING_PORT
              value: "{{ .Values.torrentPort }}"
          ports:
            - name: webui
              containerPort: {{ .Values.webuiPort }}
              protocol: TCP
            - name: torrent-tcp
              containerPort: {{ .Values.torrentPort }}
              protocol: TCP
            - name: torrent-udp
              containerPort: {{ .Values.torrentPort }}
              protocol: UDP
          volumeMounts:
            - name: config
              mountPath: /config
            - name: downloads
              mountPath: /downloads
          livenessProbe: {{- toYaml $.Values.global.livenessProbe | nindent 12 }}
          readinessProbe: {{- toYaml $.Values.global.readinessProbe | nindent 12 }}
      volumes:
        - name: config
          hostPath:
            path: /media/{{ .Values.global.mountPoint }}/Media/Metadata/qbittorrent/appdata
        - name: downloads
          hostPath:
            path: /media/{{ .Values.global.mountPoint }}/Media/Downloads/completed
